name: CI

on:
  push:
    branches:
      - 4.next-cake6

  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  testsuite:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # composer.json declares php >=8.5 and cakephp/cakephp ^6.0 (6.x-dev until 6.0.0 is tagged).
        php-version: ['8.5']

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, sqlite3, pdo_sqlite
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php-version }}-

      - name: Install dependencies
        # composer.lock is gitignored, so resolve dependencies on each run.
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Run integration tests
        run: composer test-integration

  cs-stan:
    name: Coding Standard & Static Analysis
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHP CodeSniffer
        run: composer cs-check

      - name: Run PHPStan
        run: composer stan -- --no-progress
